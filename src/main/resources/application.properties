# Application under test. Every poc.* key can be overridden by an environment
# variable, for example POC_METER_COUNT or POC_HTTP_VERSION.
poc.meter-count=360000
poc.interval-seconds=900
poc.rate-limit=400
poc.ramp-up-seconds=60
poc.scheduler-enabled=true
poc.target-url=http://wiremock:8080
poc.client=quarkus
poc.http-version=HTTP_1_1
poc.http2-max-connections=64
poc.max-connections=4000
poc.timeout-seconds=30
poc.max-response-bytes=16384
poc.late-threshold-millis=1000
poc.db-enabled=false
# Used only to label outcomes in the report as "injected" (expected from the
# WireMock profile) or "unexpected". They mirror wiremock/profile-full.
poc.analysis.injected-timeout-pattern=.*00[0-4]$
poc.analysis.injected-503-pattern=.*(00[5-9]|01[0-4])$

quarkus.http.port=8080
quarkus.banner.enabled=false
quarkus.log.level=INFO

quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.http-server.enabled=false
quarkus.micrometer.binder.http-client.enabled=false

# Stage 2 only. The datasource stays inactive unless POC_DB_ENABLED=true.
quarkus.datasource.active=${poc.db-enabled}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/poc
quarkus.datasource.username=poc
quarkus.datasource.password=poc
quarkus.datasource.jdbc.min-size=8
quarkus.datasource.jdbc.max-size=32
quarkus.datasource.jdbc.acquisition-timeout=10S
